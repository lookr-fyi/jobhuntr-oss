name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Verify browser and Electron workflows
        run: xvfb-run -a npm run verify

  clean-one-line-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Launch from a dependency-free checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -d node_modules
          JOBHUNTR_NO_OPEN=1 PORT=8790 ./run.sh > /tmp/jobhuntr-clean-launch.log 2>&1 &
          launcher_pid=$!
          cleanup() { kill -TERM "$launcher_pid" 2>/dev/null || true; wait "$launcher_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in {1..120}; do
            if curl -fsS http://127.0.0.1:8790/api/health > /tmp/jobhuntr-health.json; then break; fi
            if ! kill -0 "$launcher_pid" 2>/dev/null; then cat /tmp/jobhuntr-clean-launch.log; exit 1; fi
            sleep 1
          done
          grep -q '"mode":"local-only"' /tmp/jobhuntr-health.json
          curl -fsS http://127.0.0.1:8790/ | grep -q '<title>JobHuntr</title>'

  desktop-package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:desktop
      - name: Smoke-test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node --test tests/e2e/packaged-smoke.test.mjs
      - name: Smoke-test packaged app (macOS and Windows)
        if: runner.os != 'Linux'
        run: node --test tests/e2e/packaged-smoke.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: jobhuntr-desktop-${{ matrix.os }}
          path: release/
          retention-days: 7
